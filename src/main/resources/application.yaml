spring:
  application:
    name: bms-service
  datasource:
    url: ${APP_DATASOURCE_URL:jdbc:mysql://localhost:3306/bms}
    username: ${APP_DATASOURCE_USERNAME:bms}
    password: ${APP_DATASOURCE_PASSWORD:b15dcpt082}
    hikari:
      pool-name: bms-pool
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        globally_quoted_identifiers: true
        globally_quoted_identifiers_skip_column_definitions: true
    open-in-view: false
  data:
    redis:
      host: ${APP_REDIS_HOST:localhost}
      port: ${APP_REDIS_PORT:6379}
      username: ${APP_REDIS_USERNAME:}
      password: ${APP_REDIS_PASSWORD:}
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.xml
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${APP_SECURITY_KEYCLOAK_ISSUER_URI:httpis://identity.gmky.dev/realms/kalenz}
  cache:
    type: redis
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
management:
  server:
    port: 8081
    endpoints:
      web:
        exposure:
          include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  otlp:
    metrics:
      export:
        enabled: false        # the starter includes an OTLP metrics exporter; Prometheus scrapes instead
  tracing:
    sampling:
      probability: 0.1        # 1.0 while testing
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://tempo:4318/v1/traces
app:
  cache:
    default-ttl: 30
  security:
    public-paths:
      - /error
      - /v3/api-docs/**
      - /swagger-ui/**
      - /actuator/health/**
      - /actuator/prometheus