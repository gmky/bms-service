openapi: 3.0.3
info:
  title: BMS - Access Control Client APIs V1
  description: BMS - Access Control Client APIs V1
  contact:
    email: hiepvh.dev@gmail.com
  version: 1.0.0
servers:
  - description: LOCAL
    url: http://localhost:8080
tags:
  - name: Reference Data
    description: Platform-managed reference data (Actions, Resources, Business Functions, Privileges)
  - name: Service Agreements
    description: Service Agreement management
  - name: Job Roles
    description: Job Role management and privilege assignment
  - name: Data Groups
    description: Data Group management and item management
  - name: User Contexts
    description: User Context management
  - name: User Assignments
    description: Assign job roles and data groups to users
  - name: Access Check
    description: Access verification and entitlement queries

paths:

  # ─────────────────────────────────────────
  # REFERENCE DATA — Actions
  # ─────────────────────────────────────────
  /v1/access-control/actions:
    get:
      tags: [Reference Data]
      operationId: listActions
      summary: List all actions
      responses:
        '200':
          description: List of actions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActionDto'

  /v1/access-control/actions/{id}:
    get:
      tags: [Reference Data]
      operationId: getAction
      summary: Get an action by ID
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Action found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionDto'
        '404':
          $ref: '#/components/responses/NotFound'

  # ─────────────────────────────────────────
  # REFERENCE DATA — Resources
  # ─────────────────────────────────────────
  /v1/access-control/resources:
    get:
      tags: [Reference Data]
      operationId: listResources
      summary: List all resources
      responses:
        '200':
          description: List of resources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ResourceDto'
    post:
      tags: [Reference Data]
      operationId: createResource
      summary: Create a new resource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceDto'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/access-control/resources/{id}:
    get:
      tags: [Reference Data]
      operationId: getResource
      summary: Get a resource by ID
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Resource found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceDto'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Reference Data]
      operationId: updateResource
      summary: Update a resource
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceDto'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Reference Data]
      operationId: deleteResource
      summary: Delete a resource
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'

  # ─────────────────────────────────────────
  # REFERENCE DATA — Business Functions
  # ─────────────────────────────────────────
  /v1/access-control/business-functions:
    get:
      tags: [Reference Data]
      operationId: listBusinessFunctions
      summary: List all business functions
      responses:
        '200':
          description: List of business functions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BusinessFunctionDto'
    post:
      tags: [Reference Data]
      operationId: createBusinessFunction
      summary: Create a new business function
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessFunctionRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessFunctionDto'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/access-control/business-functions/{id}:
    get:
      tags: [Reference Data]
      operationId: getBusinessFunction
      summary: Get a business function by ID
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Business function found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessFunctionDto'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Reference Data]
      operationId: updateBusinessFunction
      summary: Update a business function
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessFunctionRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessFunctionDto'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Reference Data]
      operationId: deleteBusinessFunction
      summary: Delete a business function
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'

  # ─────────────────────────────────────────
  # REFERENCE DATA — Privileges
  # ─────────────────────────────────────────
  /v1/access-control/privileges:
    get:
      tags: [Reference Data]
      operationId: listPrivileges
      summary: List privileges with optional filters
      parameters:
        - name: functionCode
          in: query
          schema:
            type: string
        - name: resourceCode
          in: query
          schema:
            type: string
        - name: actionCode
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of privileges
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PrivilegeDto'
    post:
      tags: [Reference Data]
      operationId: createPrivilege
      summary: Create a privilege (BusinessFunction × Resource × Action)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrivilegeRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivilegeDto'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/access-control/privileges/{id}:
    get:
      tags: [Reference Data]
      operationId: getPrivilege
      summary: Get a privilege by ID
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Privilege found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivilegeDto'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Reference Data]
      operationId: deletePrivilege
      summary: Delete a privilege
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'

  # ─────────────────────────────────────────
  # SERVICE AGREEMENTS
  # ─────────────────────────────────────────
  /v1/access-control/service-agreements:
    get:
      tags: [Service Agreements]
      operationId: listServiceAgreements
      summary: List service agreements
      parameters:
        - name: state
          in: query
          schema:
            $ref: '#/components/schemas/ServiceAgreementState'
      responses:
        '200':
          description: List of service agreements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServiceAgreementDto'
    post:
      tags: [Service Agreements]
      operationId: createServiceAgreement
      summary: Create a service agreement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceAgreementRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAgreementDto'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/access-control/service-agreements/{id}:
    get:
      tags: [Service Agreements]
      operationId: getServiceAgreement
      summary: Get a service agreement by ID
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Service agreement found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAgreementDto'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Service Agreements]
      operationId: updateServiceAgreement
      summary: Update a service agreement
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceAgreementRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAgreementDto'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Service Agreements]
      operationId: deleteServiceAgreement
      summary: Soft-delete a service agreement (transitions to DELETED state)
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/access-control/service-agreements/{id}/state:
    patch:
      tags: [Service Agreements]
      operationId: updateServiceAgreementState
      summary: Change service agreement state (ENABLED / DISABLED / DELETED)
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceAgreementStateRequest'
      responses:
        '200':
          description: State updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAgreementDto'
        '404':
          $ref: '#/components/responses/NotFound'

  # ─────────────────────────────────────────
  # JOB ROLES
  # ─────────────────────────────────────────
  /v1/access-control/service-agreements/{saId}/job-roles:
    get:
      tags: [Job Roles]
      operationId: listJobRolesByServiceAgreement
      summary: List job roles for a service agreement
      parameters:
        - name: saId
          in: path
          required: true
          schema:
            type: string
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/JobRoleType'
      responses:
        '200':
          description: List of job roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobRoleDto'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Job Roles]
      operationId: createJobRole
      summary: Create a CUSTOM job role in a service agreement
      parameters:
        - name: saId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobRoleRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobRoleDto'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/access-control/job-roles:
    get:
      tags: [Job Roles]
      operationId: listReferenceJobRoles
      summary: List platform-wide REFERENCE job roles
      responses:
        '200':
          description: List of reference job roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobRoleDto'

  /v1/access-control/job-roles/{id}:
    get:
      tags: [Job Roles]
      operationId: getJobRole
      summary: Get a job role by ID
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Job role found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobRoleDto'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Job Roles]
      operationId: updateJobRole
      summary: Update a job role
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobRoleRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobRoleDto'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Job Roles]
      operationId: deleteJobRole
      summary: Delete a job role
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/access-control/job-roles/{id}/privileges:
    get:
      tags: [Job Roles]
      operationId: listJobRolePrivileges
      summary: List privileges assigned to a job role
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: List of privileges
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PrivilegeDto'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Job Roles]
      operationId: setJobRolePrivileges
      summary: Replace the full privilege set for a job role (bulk replace)
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobRolePrivilegesRequest'
      responses:
        '200':
          description: Privileges updated
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PrivilegeDto'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/access-control/job-roles/{id}/privileges/{privilegeId}:
    post:
      tags: [Job Roles]
      operationId: addPrivilegeToJobRole
      summary: Add a single privilege to a job role
      parameters:
        - $ref: '#/components/parameters/id'
        - name: privilegeId
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Privilege added
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Job Roles]
      operationId: removePrivilegeFromJobRole
      summary: Remove a privilege from a job role
      parameters:
        - $ref: '#/components/parameters/id'
        - name: privilegeId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Removed
        '404':
          $ref: '#/components/responses/NotFound'

  # ─────────────────────────────────────────
  # DATA GROUPS
  # ─────────────────────────────────────────
  /v1/access-control/service-agreements/{saId}/data-groups:
    get:
      tags: [Data Groups]
      operationId: listDataGroupsByServiceAgreement
      summary: List data groups for a service agreement
      parameters:
        - name: saId
          in: path
          required: true
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of data groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DataGroupDto'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Data Groups]
      operationId: createDataGroup
      summary: Create a data group in a service agreement
      parameters:
        - name: saId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataGroupRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataGroupDto'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/access-control/data-groups/{id}:
    get:
      tags: [Data Groups]
      operationId: getDataGroup
      summary: Get a data group by ID
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Data group found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataGroupDto'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Data Groups]
      operationId: updateDataGroup
      summary: Update a data group
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataGroupRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataGroupDto'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Data Groups]
      operationId: deleteDataGroup
      summary: Delete a data group (cascades items and scoped assignments)
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/access-control/data-groups/{id}/items:
    get:
      tags: [Data Groups]
      operationId: listDataGroupItems
      summary: List items in a data group
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: List of data group items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DataGroupItemDto'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Data Groups]
      operationId: setDataGroupItems
      summary: Replace all items in a data group (bulk replace)
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataGroupItemsRequest'
      responses:
        '200':
          description: Items replaced
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DataGroupItemDto'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Data Groups]
      operationId: addDataGroupItems
      summary: Add items to a data group
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataGroupItemsRequest'
      responses:
        '201':
          description: Items added
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/access-control/data-groups/{id}/items/{itemId}:
    delete:
      tags: [Data Groups]
      operationId: removeDataGroupItem
      summary: Remove a specific item from a data group
      parameters:
        - $ref: '#/components/parameters/id'
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Removed
        '404':
          $ref: '#/components/responses/NotFound'

  # ─────────────────────────────────────────
  # USER CONTEXTS
  # ─────────────────────────────────────────
  /v1/access-control/service-agreements/{saId}/users:
    get:
      tags: [User Contexts]
      operationId: listUsersInServiceAgreement
      summary: List user contexts in a service agreement
      parameters:
        - name: saId
          in: path
          required: true
          schema:
            type: string
        - name: state
          in: query
          schema:
            $ref: '#/components/schemas/UserContextState'
      responses:
        '200':
          description: List of user contexts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserContextDto'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [User Contexts]
      operationId: addUserToServiceAgreement
      summary: Add a user to a service agreement (creates UserContext)
      parameters:
        - name: saId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserContextRequest'
      responses:
        '201':
          description: User context created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserContextDto'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/access-control/users/{userId}/contexts:
    get:
      tags: [User Contexts]
      operationId: listUserContexts
      summary: List all service agreements a user belongs to
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of user contexts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserContextDto'

  /v1/access-control/user-contexts/{id}:
    get:
      tags: [User Contexts]
      operationId: getUserContext
      summary: Get a user context by ID
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: User context found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserContextDto'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [User Contexts]
      operationId: removeUserFromServiceAgreement
      summary: Remove a user from a service agreement
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: Removed
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/access-control/user-contexts/{id}/state:
    patch:
      tags: [User Contexts]
      operationId: updateUserContextState
      summary: Enable or disable a user context
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserContextStateRequest'
      responses:
        '200':
          description: State updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserContextDto'
        '404':
          $ref: '#/components/responses/NotFound'

  # ─────────────────────────────────────────
  # USER ASSIGNMENTS
  # ─────────────────────────────────────────
  /v1/access-control/user-contexts/{contextId}/job-roles:
    get:
      tags: [User Assignments]
      operationId: listAssignedJobRoles
      summary: List job roles assigned to a user context
      parameters:
        - name: contextId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of assigned job roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserAssignedJobRoleDto'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [User Assignments]
      operationId: assignJobRole
      summary: Assign a job role to a user context (with optional data group scope)
      parameters:
        - name: contextId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignJobRoleRequest'
      responses:
        '201':
          description: Job role assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAssignedJobRoleDto'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/access-control/user-contexts/{contextId}/job-roles/{assignmentId}:
    delete:
      tags: [User Assignments]
      operationId: unassignJobRole
      summary: Unassign a job role from a user context
      parameters:
        - name: contextId
          in: path
          required: true
          schema:
            type: string
        - name: assignmentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Unassigned
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/access-control/job-role-assignments/{assignmentId}/data-groups:
    get:
      tags: [User Assignments]
      operationId: listAssignmentDataGroups
      summary: List data groups scoped to a job role assignment
      parameters:
        - name: assignmentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of scoped data groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DataGroupDto'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [User Assignments]
      operationId: setAssignmentDataGroups
      summary: Replace scoped data groups for a job role assignment (bulk)
      parameters:
        - name: assignmentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataGroupScopeRequest'
      responses:
        '200':
          description: Data group scope updated
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DataGroupDto'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/access-control/job-role-assignments/{assignmentId}/data-groups/{dataGroupId}:
    post:
      tags: [User Assignments]
      operationId: addDataGroupToAssignment
      summary: Add a data group to a job role assignment scope
      parameters:
        - name: assignmentId
          in: path
          required: true
          schema:
            type: string
        - name: dataGroupId
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Data group added to scope
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [User Assignments]
      operationId: removeDataGroupFromAssignment
      summary: Remove a data group from a job role assignment scope
      parameters:
        - name: assignmentId
          in: path
          required: true
          schema:
            type: string
        - name: dataGroupId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Removed
        '404':
          $ref: '#/components/responses/NotFound'

  # ─────────────────────────────────────────
  # ACCESS CHECK
  # ─────────────────────────────────────────
  /v1/access-control/access/check:
    post:
      tags: [Access Check]
      operationId: checkAccess
      summary: Check if a user has a specific privilege
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessCheckRequest'
      responses:
        '200':
          description: Access check result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessCheckResponse'

  /v1/access-control/access/check/batch:
    post:
      tags: [Access Check]
      operationId: batchCheckAccess
      summary: Check multiple permissions in one call
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchAccessCheckRequest'
      responses:
        '200':
          description: Batch access check results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchAccessCheckResponse'

  /v1/access-control/users/{userId}/entitlements:
    get:
      tags: [Access Check]
      operationId: getUserEntitlements
      summary: Get all effective privileges for a user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
        - name: serviceAgreementId
          in: query
          schema:
            type: string
      responses:
        '200':
          description: User entitlements
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntitlementsResponse'

  /v1/access-control/users/{userId}/data-groups:
    get:
      tags: [Access Check]
      operationId: getUserDataGroups
      summary: Get all data groups accessible to a user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
        - name: serviceAgreementId
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Accessible data groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DataGroupDto'

components:

  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: string

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Resource already exists or state conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:

    # ── Error ──────────────────────────────
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
        code:
          type: string

    # ── Reference Data ─────────────────────
    ActionDto:
      type: object
      properties:
        id:
          type: string
        code:
          type: string

    ResourceDto:
      type: object
      properties:
        id:
          type: string
        resourceName:
          type: string
        resourceCode:
          type: string
        description:
          type: string

    ResourceRequest:
      type: object
      required: [resourceName, resourceCode]
      properties:
        resourceName:
          type: string
          maxLength: 100
        resourceCode:
          type: string
          maxLength: 100
        description:
          type: string

    BusinessFunctionDto:
      type: object
      properties:
        id:
          type: string
        functionName:
          type: string
        functionCode:
          type: string
        description:
          type: string

    BusinessFunctionRequest:
      type: object
      required: [functionName, functionCode]
      properties:
        functionName:
          type: string
          maxLength: 100
        functionCode:
          type: string
          maxLength: 100
        description:
          type: string

    PrivilegeDto:
      type: object
      properties:
        id:
          type: string
        function:
          $ref: '#/components/schemas/BusinessFunctionDto'
        resource:
          $ref: '#/components/schemas/ResourceDto'
        action:
          $ref: '#/components/schemas/ActionDto'

    PrivilegeRequest:
      type: object
      required: [functionId, resourceId, actionId]
      properties:
        functionId:
          type: string
        resourceId:
          type: string
        actionId:
          type: string

    # ── Service Agreement ──────────────────
    ServiceAgreementState:
      type: string
      enum: [ENABLED, DISABLED, DELETED]

    ServiceAgreementDto:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        externalId:
          type: string
        description:
          type: string
        state:
          $ref: '#/components/schemas/ServiceAgreementState'
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        stateChangedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ServiceAgreementRequest:
      type: object
      required: [name, externalId, state]
      properties:
        name:
          type: string
        externalId:
          type: string
          maxLength: 64
        description:
          type: string
        state:
          $ref: '#/components/schemas/ServiceAgreementState'
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time

    ServiceAgreementStateRequest:
      type: object
      required: [state]
      properties:
        state:
          $ref: '#/components/schemas/ServiceAgreementState'

    # ── Job Role ───────────────────────────
    JobRoleType:
      type: string
      enum: [REFERENCE, CUSTOM]

    JobRoleDto:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        type:
          $ref: '#/components/schemas/JobRoleType'
        serviceAgreementId:
          type: string
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    JobRoleRequest:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
        description:
          type: string
        type:
          $ref: '#/components/schemas/JobRoleType'
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time

    JobRolePrivilegesRequest:
      type: object
      required: [privilegeIds]
      properties:
        privilegeIds:
          type: array
          items:
            type: string

    # ── Data Group ─────────────────────────
    DataGroupDto:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        description:
          type: string
        serviceAgreementId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    DataGroupRequest:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
        type:
          type: string
        description:
          type: string

    DataGroupItemDto:
      type: object
      properties:
        id:
          type: string
        dataItemId:
          type: string

    DataGroupItemsRequest:
      type: object
      required: [dataItemIds]
      properties:
        dataItemIds:
          type: array
          items:
            type: string

    DataGroupScopeRequest:
      type: object
      required: [dataGroupIds]
      properties:
        dataGroupIds:
          type: array
          items:
            type: string

    # ── User Context ───────────────────────
    UserContextState:
      type: string
      enum: [ENABLED, DISABLED]

    UserContextType:
      type: string
      enum: [DEFAULT, SHARED]

    UserContextDto:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        serviceAgreementId:
          type: string
        state:
          $ref: '#/components/schemas/UserContextState'
        type:
          $ref: '#/components/schemas/UserContextType'
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UserContextRequest:
      type: object
      required: [userId, type, state]
      properties:
        userId:
          type: string
          maxLength: 36
        type:
          $ref: '#/components/schemas/UserContextType'
        state:
          $ref: '#/components/schemas/UserContextState'
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time

    UserContextStateRequest:
      type: object
      required: [state]
      properties:
        state:
          $ref: '#/components/schemas/UserContextState'

    # ── User Assignments ───────────────────
    UserAssignedJobRoleDto:
      type: object
      properties:
        id:
          type: string
        userContextId:
          type: string
        jobRole:
          $ref: '#/components/schemas/JobRoleDto'
        dataGroups:
          type: array
          items:
            $ref: '#/components/schemas/DataGroupDto'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AssignJobRoleRequest:
      type: object
      required: [jobRoleId]
      properties:
        jobRoleId:
          type: string
        dataGroupIds:
          type: array
          items:
            type: string
          default: []

    # ── Access Check ───────────────────────
    AccessCheckRequest:
      type: object
      required: [userId, serviceAgreementId, functionCode, resourceCode, actionCode]
      properties:
        userId:
          type: string
        serviceAgreementId:
          type: string
        functionCode:
          type: string
        resourceCode:
          type: string
        actionCode:
          type: string

    AccessCheckResponse:
      type: object
      properties:
        allowed:
          type: boolean
        dataGroupIds:
          type: array
          items:
            type: string

    BatchCheckItem:
      type: object
      required: [functionCode, resourceCode, actionCode]
      properties:
        functionCode:
          type: string
        resourceCode:
          type: string
        actionCode:
          type: string

    BatchCheckResultItem:
      type: object
      properties:
        functionCode:
          type: string
        resourceCode:
          type: string
        actionCode:
          type: string
        allowed:
          type: boolean
        dataGroupIds:
          type: array
          items:
            type: string

    BatchAccessCheckRequest:
      type: object
      required: [userId, serviceAgreementId, checks]
      properties:
        userId:
          type: string
        serviceAgreementId:
          type: string
        checks:
          type: array
          items:
            $ref: '#/components/schemas/BatchCheckItem'

    BatchAccessCheckResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/BatchCheckResultItem'

    FunctionPrivilege:
      type: object
      properties:
        functionCode:
          type: string
        resourceCode:
          type: string
        actions:
          type: array
          items:
            type: string

    EntitlementsResponse:
      type: object
      properties:
        userId:
          type: string
        serviceAgreementId:
          type: string
        privileges:
          type: array
          items:
            $ref: '#/components/schemas/FunctionPrivilege'
