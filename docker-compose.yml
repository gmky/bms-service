services:
  bms-service:
    image: ghcr.io/${IMAGE_OWNER}/bms-service/bms-service:${IMAGE_TAG:-latest}
    container_name: bms-service
    restart: unless-stopped
    networks:
      - npm-network
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
      - JAVA_OPTS=-XX:+UseContainerSupport -XX:MaxRAMPercentage=50.0
    mem_limit: 8g
    mem_reservation: 4g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

networks:
  npm-network:
    external: true
